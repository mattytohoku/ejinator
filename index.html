<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#EFEAF8">
<title>医療アキネイター</title>
<style>
:root{
  --paper:#EFEAF8; --card:#FFFFFF; --line:#D6CFE8; --ink:#1E1830; --soft:#5F5A70;
  --green:#2E6E5E; --green-deep:#1C4A40; --green-soft:#DCEBE4;
  --plum:#7B2D5E; --plum-soft:#F0DEE8; --brick:#B4442C; --amber:#F2971F;
  --sans:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","Noto Sans JP",Meiryo,sans-serif;
  --mincho:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",YuMincho,"MS PMincho",serif;
}
*{box-sizing:border-box}
/* 端末のダークモードに合わせて勝手に反転させない。明るい配色で固定する。 */
:root{color-scheme:light}
html,body{margin:0;padding:0;background:var(--paper)}
html{min-height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.6;
  min-height:100vh;-webkit-text-size-adjust:100%;forced-color-adjust:none}
input,textarea,button{color-scheme:light}
.wrap{max-width:720px;margin:0 auto;padding:20px}
.wrap.wide{max-width:1140px}
h1,h2,h3,p,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
button{font-family:inherit;font-size:inherit}
input,textarea{font-family:inherit;font-size:16px;width:100%;padding:10px 12px;
  border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);
  -webkit-text-fill-color:var(--ink);appearance:none}
input::placeholder,textarea::placeholder{color:#9A93AC;-webkit-text-fill-color:#9A93AC}
textarea{resize:vertical}
input:focus,textarea:focus{outline:2px solid var(--green);outline-offset:1px}
.btn{display:inline-block;padding:12px 20px;border:1px solid var(--green);border-radius:8px;
  background:var(--green);color:#fff;font-weight:700;cursor:pointer;text-align:center}
.btn.small{padding:7px 12px;font-size:13px}
.btn.full{display:block;width:100%}
.btn.quiet{background:#fff;color:var(--ink);border-color:var(--line)}
.btn.plum{background:var(--plum);border-color:var(--plum);color:#fff}
.btn.warn{background:#fff;color:var(--brick);border-color:#E3BCB2}
.btn[disabled]{background:#E8E4F0;color:#A49EB4;border-color:#DCD6E8;cursor:not-allowed}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:20px}
.panel .head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px}
.panel h2{font-size:17px}
.note{font-size:12px;color:var(--soft)}
.muted{color:var(--soft)}
.small{font-size:13px}
.xs{font-size:12px}
.b{font-weight:700}
.center{text-align:center}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.stack>*+*{margin-top:10px}
header.hero{padding:24px 0 8px;text-align:center}
header.hero .eyebrow{color:var(--green);font-weight:700;font-size:14px}
header.hero .eyebrow em{font-style:normal;font-size:20px;font-weight:900}
header.hero h1{font-family:var(--mincho);font-size:40px;font-weight:700;letter-spacing:.16em;
  text-indent:.16em;margin-top:10px}
header.hero .rule{width:64px;height:4px;border-radius:2px;background:var(--amber);margin:16px auto 0}
.join{display:flex;gap:16px;align-items:center;justify-content:center;flex-wrap:wrap}
.join img.genie{width:176px;display:block}
.join .box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;
  width:100%;max-width:300px}
.bottom{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;
  flex-wrap:wrap;margin-top:40px}
.tile{background:#F7F4FC;border:1px solid var(--line);border-radius:10px;padding:10px}
.tile.pad{padding:12px}
.qr{background:#fff;border:1px solid var(--line);border-radius:6px;padding:4px;display:block}
.qr img{display:block}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
  background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 16px;margin-bottom:20px}
.code{font-size:24px;font-weight:900;color:var(--green);letter-spacing:.15em}
.tag{background:var(--green-soft);color:var(--green-deep);border-radius:6px;padding:3px 8px;
  font-size:12px;font-weight:700}
.callout{border:2px solid var(--brick);background:#fff;border-radius:12px;padding:20px;margin-bottom:20px}
.callout.ok{border-color:var(--green)}
.callout .label{font-size:13px;font-weight:700;color:var(--brick)}
.callout.ok .label{color:var(--green)}
/* 質問文・立ち絵・選択肢を3列に置き、両側を同じ幅にして立ち絵を中央にそろえる */
.qrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;align-items:center}
.qrow .pose{width:100%;max-width:118px;display:block;justify-self:center}
.qrow .qtext{min-width:0;justify-self:center;text-align:center}
.qrow .qtext .q{font-size:22px}
.qrow .qopts{justify-self:stretch;display:flex;flex-direction:column;gap:4px}
.qrow .qopts .opt{font-size:12px;padding:5px 8px;text-align:center;opacity:.85}
.callout.done{border-color:var(--green)}
.callout.done .label{color:var(--green)}
@media(max-width:600px){
  .qrow{grid-template-columns:auto 1fr}
  .qrow .qtext{grid-column:1 / -1;text-align:center}
  .qrow .qtext .q{font-size:19px}
  .qrow .pose{width:82px}
  .qrow .qopts{width:auto;justify-self:stretch}
  .qrow .qopts .opt{font-size:11px;padding:4px 6px}
}
.callout .q{font-size:26px;font-weight:900;line-height:1.4;margin-top:8px}
.item{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:#fff}
.item+.item{margin-top:8px}
.item.alt{background:#F9F7FD}
.hist{display:flex;gap:12px;align-items:flex-start}
.hist .n{width:24px;text-align:right;font-weight:700;color:var(--soft);font-variant-numeric:tabular-nums}
.badge{display:inline-block;border-radius:6px;padding:4px 8px;font-size:12px;font-weight:700;
  white-space:nowrap;border:1px solid}
.ans-yes{background:var(--green);color:#fff;border-color:var(--green)}
.ans-probably{background:var(--green-soft);color:var(--green-deep);border-color:#A8CBBE}
.ans-unsure{background:#E8E6EE;color:#4B4558;border-color:#CBC5D8}
.ans-probablyNot{background:var(--plum-soft);color:var(--plum);border-color:#DCBDCE}
.ans-no{background:var(--plum);color:#fff;border-color:var(--plum)}
.ans-skip{background:#fff;color:var(--soft);border-color:var(--line)}
.ansbtn{display:block;width:100%;text-align:left;padding:14px 16px;border-radius:8px;
  border:1px solid;font-size:17px;font-weight:700;cursor:pointer;margin-bottom:8px}
.grid3{display:grid;gap:20px}
@media(min-width:980px){.grid3{grid-template-columns:1fr 1fr 1fr}}
.bar-track{height:8px;background:#E4DFEF;border-radius:4px;margin-top:4px}
.bar-fill{height:8px;background:var(--green);border-radius:4px}
.overlay{position:fixed;inset:0;background:rgba(30,24,48,.55);display:flex;align-items:center;
  justify-content:center;padding:24px;z-index:50}
.modal{background:#fff;border:2px solid var(--green);border-radius:16px;padding:24px;
  max-width:380px;width:100%;text-align:center}
.modal .big{font-size:28px;font-weight:900;line-height:1.35;margin-top:12px}
.warn-box{border:1px solid #E3BCB2;background:#FBF0ED;color:var(--brick);border-radius:10px;
  padding:14px;font-size:13px;margin-top:24px}
.setup code{background:#F1EDF9;padding:2px 6px;border-radius:4px;font-size:13px;word-break:break-all}
.setup ol{list-style:decimal;padding-left:22px}
.setup li{margin-bottom:10px}
</style>
</head>

  { key: "yes", label: "はい" },

];
function answerLabel(k){ for(var i=0;i<ANSWERS.length;i++) if(ANSWERS[i].key===k) return ANSWERS[i].label; return "—"; }

/* ---------- 通信 ---------- */
function dbBase(){
  var u = DB_URL || localStorage.getItem("mq_db") || "";
  return u.replace(/\/+$/,"");
}
function apiGet(path){
  return fetch(dbBase()+path+".json?_="+Date.now(), {cache:"no-store"})
    .then(function(r){ return r.ok ? r.json() : null; })
    .catch(function(){ return null; });
}
function apiPut(path, val){
  return fetch(dbBase()+path+".json", {
    method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(val)
  }).then(function(r){ return r.ok; }).catch(function(){ return false; });
}
function apiDel(path){
  return fetch(dbBase()+path+".json", {method:"DELETE"}).then(function(r){ return r.ok; }).catch(function(){ return false; });
}

/* ---------- 小物 ---------- */
function esc(t){
  return String(t==null?"":t).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
  });
}
function uid(){ return Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4); }
var CODE_CHARS = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
function newCode(){
  var s=""; for(var i=0;i<4;i++) s+=CODE_CHARS[Math.floor(Math.random()*CODE_CHARS.length)];
  return s;
}
// 表記ゆれを吸収してから照合する
function norm(t){
  return String(t||"").normalize("NFKC").toLowerCase()
    .replace(/[\u30a1-\u30f6]/g, function(c){ return String.fromCharCode(c.charCodeAt(0)-0x60); })
    .replace(/[\s\u3000ー・\-–—_,、。.／\/()（）"'`]/g,"");
}
function arr(v){ if(!v) return []; return Array.isArray(v)? v : Object.keys(v).map(function(k){return v[k];}); }

/* ---------- 描画の枠組み ---------- */
var app = document.getElementById("app");
var renderPending = false;
var composing = false;
function render(){
  // 日本語を変換している最中に画面を作り直すと、変換が打ち切られて未確定の文字が確定してしまう。
  // 変換が終わるまで描き直しを待つ。
  if(composing){ renderPending = true; return; }
  renderPending = false;
  draw();
}
function draw(){
  var focus = document.activeElement;
  var fkey = focus && focus.getAttribute ? focus.getAttribute("data-k") : null;
  var fstart = focus && focus.selectionStart;
  app.innerHTML = screenHTML();
  if(fkey){
    var next = app.querySelector('[data-k="'+fkey+'"]');
    if(next){
      next.focus();
      try{ next.setSelectionRange(fstart, fstart); }catch(e){}
    }
  }
}
document.addEventListener("compositionstart", function(){ composing = true; });
document.addEventListener("compositionend", function(e){
  composing = false;
  var k = e.target.getAttribute && e.target.getAttribute("data-k");
  if(k){ S.drafts[k] = e.target.value; refreshButtons(); }
  if(k==="filter" || renderPending) render();
});
// 入力欄から離れたときに変換中の状態が残らないようにする
document.addEventListener("focusout", function(){
  if(composing){ composing = false; if(renderPending) setTimeout(render, 0); }
});
document.addEventListener("input", function(e){
  var k = e.target.getAttribute && e.target.getAttribute("data-k");
  if(!k) return;
  var v = e.target.value;
  if(k==="pcode") v = v.toUpperCase();
  S.drafts[k] = v;
  if(k==="pcode") e.target.value = v;
  refreshButtons();
  if(k==="filter" && !composing) render();
});

// 入力に応じてボタンの有効・無効だけを切り替える。
// 画面全体を描き直すと日本語入力の変換が途切れるため、ここでは属性だけを更新する。
function refreshButtons(){
  var rules = {
    joinPlayer: function(){ return d("pname").trim() && d("pcode").trim().length>=3; },
    joinRep:    function(){ return d("gmcode").trim().length>=3; },
    saveDb:     function(){ return d("dburl").trim(); },
    saveSubject:function(){ return d("subject").trim(); },
    submitQ:    function(){ return d("qdraft").trim(); },
    confirmGuess:function(){ return d("guess").trim(); },
    saveEdit:   function(){ return d("edit").trim(); },
    askFree:    function(){ return d("gmdraft").trim() && !g().current; }
  };
  Object.keys(rules).forEach(function(act){
    var btn = document.querySelector('[data-act="'+act+'"]');
    if(!btn) return;
    if(rules[act]()) btn.removeAttribute("disabled");
    else btn.setAttribute("disabled","");
  });
}
document.addEventListener("keydown", function(e){
  if(e.key!=="Enter") return;
  var k = e.target.getAttribute && e.target.getAttribute("data-k");
  if(k==="staffpw"){ e.preventDefault(); act("staffOpen"); }
});
document.addEventListener("click", function(e){
  var t = e.target.closest("[data-act]");
  if(!t) return;
  e.preventDefault();
  act(t.getAttribute("data-act"), t.getAttribute("data-arg"));
});
function d(k){ return S.drafts[k]==null ? "" : S.drafts[k]; }

  var G = g(), out = "";
  if(G.phase==="voting") out += voteBox();
  if(G.phase==="result") out += '<div class="panel"><div class="head"><h2>投票結果</h2></div>'+voteResult()+'</div>';
  if(G.phase==="reveal"||G.phase==="voting"||G.phase==="result"){

      '<p class="b" style="font-size:28px;color:var(--green)">'+esc(G.revealed||"")+'</p>'+
      (G.winner?'<p class="small b" style="color:var(--plum);margin-top:6px">'+esc(G.winner.name)+'さんが当てました</p>':'')+'</div>';
  }
  // 1. いま出ている質問（左から 質問文・立ち絵・選択肢）
  if(G.phase==="playing"){
    var shown = G.current || G.last;
    if(shown){
      var answered = !G.current;
      var poseIdx = answered ? Math.max(G.history.length-1,0) : G.history.length;
      var pose = POSES[poseIdx % POSES.length];
      var opts = answered
        ? '<span class="badge ans-'+shown.answer+'" style="font-size:15px;padding:10px 12px;display:block;text-align:center">'+
            esc(answerLabel(shown.answer))+'</span>'
        : ANSWERS.map(function(a){
            return '<span class="badge ans-'+a.key+' opt">'+a.label+'</span>';
          }).join("");
      out += '<div class="callout'+(answered?' done':'')+'"><div class="qrow">'+
        '<div class="qtext"><p class="label">'+(answered?'この質問への答え':'いま出ている質問')+'</p>'+
          '<p class="q">'+esc(shown.text)+'</p></div>'+
        '<img class="pose" src="'+pose+'" alt="">'+
        '<div class="qopts">'+opts+'</div>'+
      '</div></div>';
    }
  }
  // 2. 質問カルテ
  out += '<div class="panel"><div class="head"><h2>質問カルテ</h2><span class="note">'+G.history.length+'問</span></div>'+histList(G.history)+'</div>';
  // 3. 質問の投稿
  if(G.phase==="setup"||G.phase==="playing") out += questionBox();
  // 4. 解答
  if(G.phase==="playing" && !G.winner) out += guessBox();
  return '<div class="wrap">'+popup()+bar()+out+'</div>';
}

// 自分の解答がどう扱われたか。進行役の照合が届くまでは判定中のまま。
function verdictOf(x){
  var W = g().winner;
  if(W && W.ts===x.ts) return "hit";
  if(S.judgedTs >= x.ts) return "miss";
  return "pending";
}

function guessBox(){
  var left = MAX_GUESSES - S.myGuesses.length, inner;
  if(left<=0){
    inner = '<p class="small b" style="color:var(--brick)">解答できる回数を使い切りました。ここから先は質問で仲間を助けてください。</p>';
  } else if(S.guessConfirm){
    inner = '<div class="item" style="border-color:var(--plum)">'+
      '<p>「<b>'+esc(d("guess").trim())+'</b>」で解答します。本当によろしいですか？</p>'+
      '<p class="small b" style="color:var(--plum);margin-top:6px">解答回数はあと'+left+'回です。</p>'+
      '<div class="row" style="margin-top:14px">'+
      '<button class="btn plum" data-act="submitGuess">これで解答する</button>'+
      '<button class="btn quiet" data-act="cancelGuess">やめる</button></div></div>';
  } else {
    inner = '<div class="stack">'+
      '<input data-k="guess" value="'+esc(d("guess"))+'" placeholder="例：パルスオキシメータ">'+
      '<button class="btn plum full" data-act="confirmGuess"'+(d("guess").trim()?"":" disabled")+'>この答えで解答する</button></div>';
  }
  var list = S.myGuesses.length? '<ul style="margin-top:14px">'+S.myGuesses.map(function(x){
      var v = verdictOf(x);
      var mark = v==="hit" ? "正解" : (v==="miss" ? "はずれ" : "判定中");
      var col = v==="hit" ? "var(--green)" : "var(--soft)";
      return '<li class="small" style="color:'+col+'"><b>'+mark+'</b>　'+esc(x.text)+'</li>';
    }).join("")+'</ul>' : "";
  return '<div class="panel"><div class="head"><h2>お題を当てる！</h2><span class="note">あと'+Math.max(left,0)+'回</span></div>'+inner+list+'</div>';
}

function questionBox(){
  var left = MAX_QUESTIONS - S.myQs.length, inner;
  if(left>0){
    inner = '<textarea data-k="qdraft" rows="3" placeholder="はい・いいえで答えられる質問にすると当てやすくなります。&#10;例：それは手のひらにのる大きさですか？">'+esc(d("qdraft"))+'</textarea>'+
      '<div style="margin-top:12px"><button class="btn full" data-act="submitQ"'+(d("qdraft").trim()?"":" disabled")+'>送る</button></div>';
  } else {
    inner = '<p class="small muted">投稿できるのは'+MAX_QUESTIONS+'件までです。出題される前なら、下の質問を書き直せます。</p>';
  }
  var list = "";
  if(S.myQs.length){
    list = '<ul style="margin-top:14px">'+S.myQs.map(function(q){
      var used = (g().usedIds||[]).indexOf(q.id)>=0;
      if(S.editingId===q.id){
        return '<li class="item"><textarea data-k="edit" rows="2">'+esc(d("edit"))+'</textarea>'+
          '<div class="row" style="margin-top:8px">'+
          '<button class="btn small" data-act="saveEdit" data-arg="'+esc(q.id)+'"'+(d("edit").trim()?"":" disabled")+'>保存する</button>'+
          '<button class="btn quiet small" data-act="cancelEdit">やめる</button></div></li>';
      }
      return '<li class="item'+(used?' alt':'')+'"><div class="row" style="justify-content:space-between;align-items:flex-start;flex-wrap:nowrap">'+
        '<span style="min-width:0"><span class="small">'+esc(q.text)+'</span><br>'+
        '<span class="xs muted">'+(used?'出題済み':'出題を待っています')+'</span></span>'+
        (used?"":'<button class="btn quiet small" data-act="edit" data-arg="'+esc(q.id)+'">書き直す</button>')+
        '</div></li>';
    }).join("")+'</ul>';
  }
  return '<div class="panel"><div class="head"><h2>質問を投稿する</h2><span class="note">あと'+Math.max(left,0)+'件</span></div>'+inner+list+'</div>';
}

function voteBox(){
  var G = g();
  if(!G.history.length) return '<div class="panel"><div class="head"><h2>いちばんよかった質問を選ぶ</h2></div><p class="small muted">投票できる質問がありません。</p></div>';
  return '<div class="panel"><div class="head"><h2>いちばんよかった質問を選ぶ</h2></div><ul>'+
    G.history.map(function(h,i){
      var on = S.myVote===h.id;
      return '<li class="item" style="cursor:pointer'+(on?';border-color:var(--green);border-width:2px;background:var(--green-soft)':'')+
        '" data-act="vote" data-arg="'+esc(h.id)+'"><div class="hist">'+
        '<span class="n">'+(i+1)+'</span><div style="flex:1;min-width:0"><p class="small b">'+esc(h.text)+'</p>'+
        '<p class="xs muted">'+esc(h.author)+'</p></div>'+
        '<span class="badge ans-'+h.answer+'">'+esc(answerLabel(h.answer))+'</span></div></li>';
    }).join("")+'</ul>'+
    (S.myVote?'<p class="small b" style="color:var(--green);margin-top:10px">投票しました。選び直すこともできます。</p>':'')+
    '</div>';
}

/* ============================================================
   3. 動作
   ============================================================ */
function P(){ return "/mq/"+S.room; }

function publish(mut){
  var next = JSON.parse(JSON.stringify(S.game));
  mut(next);
  next.updatedAt = Date.now();
  S.game = next;
  render();
  return apiPut(P()+"/state", next);
}

function act(a, arg){
  var G = g();
  if(a==="saveDb"){
    var u = d("dburl").trim().replace(/\/+$/,"");
    if(!u) return;
    localStorage.setItem("mq_db", u);
    render(); startLoops();
    return;
  }
  if(a==="staffOpen"){
    if(d("staffpw")===STAFF_PW){ S.staffOpen=true; S.staffErr=false; }
    else S.staffErr=true;
    return render();
  }
  if(a==="staffClose"){ S.staffOpen=false; S.drafts.staffpw=""; return render(); }
  if(a==="joinPlayer"){
    if(!d("pname").trim() || d("pcode").trim().length<3) return;
    return join("player", d("pcode"), d("pname"));
  }
  if(a==="joinGm") return join("gm", d("gmcode")||newCode(), "");
  if(a==="joinRep"){
    if(d("gmcode").trim().length<3) return;
    return join("rep", d("gmcode"), "");
  }
  if(a==="leave"){
    S.role=null; S.subs=[]; S.guesses=[]; S.myQs=[]; S.myGuesses=[]; S.myVote=null;
    S.answeredId=null; S.subjectSaved=false; S.showPeek=false; S.editingId=null; S.guessConfirm=false;
    return render();
  }
  if(a==="closePopup"){ S.winnerSeen=true; return render(); }

  /* 参加者 */
  if(a==="submitQ"){
    var text = d("qdraft").trim();
    if(!text || S.myQs.length>=MAX_QUESTIONS) return;
    S.myQs = S.myQs.concat([{id:ME+"-"+(S.myQs.length+1), text:text, author:S.name||"名無し", ts:Date.now()}]);
    S.drafts.qdraft=""; render();
    return apiPut(P()+"/subs/"+ME, {name:S.name||"名無し", list:S.myQs});
  }
  if(a==="edit"){
    S.editingId=arg;
    var q0 = S.myQs.filter(function(q){return q.id===arg;})[0];
    S.drafts.edit = q0?q0.text:"";
    return render();
  }
  if(a==="cancelEdit"){ S.editingId=null; return render(); }
  if(a==="saveEdit"){
    var t2 = d("edit").trim(); if(!t2) return;
    S.myQs = S.myQs.map(function(q){ return q.id===arg? {id:q.id,text:t2,author:q.author,ts:q.ts} : q; });
    S.editingId=null; render();
    return apiPut(P()+"/subs/"+ME, {name:S.name||"名無し", list:S.myQs});
  }
  if(a==="confirmGuess"){ if(d("guess").trim()){ S.guessConfirm=true; render(); } return; }
  if(a==="cancelGuess"){ S.guessConfirm=false; return render(); }
  if(a==="submitGuess"){
    var gt = d("guess").trim();
    if(!gt || S.myGuesses.length>=MAX_GUESSES) return;
    S.myGuesses = S.myGuesses.concat([{id:ME+"-g"+(S.myGuesses.length+1), text:gt, ts:Date.now()}]);
    S.drafts.guess=""; S.guessConfirm=false; render();
    return apiPut(P()+"/guesses/"+ME, {name:S.name||"名無し", list:S.myGuesses});
  }
  if(a==="vote"){
    S.myVote=arg; render();
    return apiPut(P()+"/votes/"+ME, {qid:arg, name:S.name||"名無し", ts:Date.now()});
  }

  /* 代表者 */
  if(a==="saveSubject"){
    var st = d("subject").trim(); if(!st) return;
    S.subject=st;
    S.alts=d("alts");
    S.subjectSaved=true; render();
    var alts = S.alts.split(/[,、\n]/).map(function(x){return x.trim();}).filter(Boolean);
    return apiPut(P()+"/subject", {text:st, alts:alts, ts:Date.now()});
  }
  if(a==="editSubject"){ S.subjectSaved=false; return render(); }
  if(a==="answer"){
    if(!G.current) return;
    S.answeredId=G.current.id; render();
    return apiPut(P()+"/ans", {id:G.current.id, answer:arg, ts:Date.now()});
  }

  /* ゲームマスター */
  if(a==="ask"){
    var q = S.subs.filter(function(x){return x.id===arg;})[0];
    if(!q||G.current) return;
    apiDel(P()+"/ans");
    return publish(function(n){ n.current=q; n.usedIds=(n.usedIds||[]).concat([q.id]); });
  }
  if(a==="askFree"){
    var ft = d("gmdraft").trim(); if(!ft||G.current) return;
    S.drafts.gmdraft="";
    apiDel(P()+"/ans");
    var fq = {id:"gm-"+Date.now(), text:ft, author:"ゲームマスター", ts:Date.now()};
    return publish(function(n){ n.current=fq; n.usedIds=(n.usedIds||[]).concat([fq.id]); });
  }
  if(a==="cancelCurrent"){ apiDel(P()+"/ans"); return publish(function(n){ n.current=null; }); }
  if(a==="start") return publish(function(n){ n.phase="playing"; });
  if(a==="reveal"){
    return apiGet(P()+"/subject").then(function(sj){
      var t = sj && sj.text ? sj.text : "（未設定）";
      return publish(function(n){ n.phase="reveal"; n.current=null; n.revealed=t; });
    });
  }
  if(a==="startVote") return publish(function(n){ n.phase="voting"; n.results=[]; });
  if(a==="showResult") return publish(function(n){ n.phase="result"; });
  if(a==="showAllQs"){ S.showAllQs=true; return render(); }
  if(a==="showFewQs"){ S.showAllQs=false; return render(); }
  if(a==="togglePeek"){ S.showPeek=!S.showPeek; return render(); }
  if(a==="reset"){
    S.subs=[]; S.guesses=[]; S.peek=null; S.showPeek=false; S.myQs=[]; S.myGuesses=[]; S.winnerSeen=false;
    S.subject=""; S.alts=""; S.subjectSaved=false; S.drafts.subject=""; S.drafts.alts="";
    return Promise.all([
      apiDel(P()+"/subs"), apiDel(P()+"/guesses"), apiDel(P()+"/votes"),
      apiDel(P()+"/ans"), apiDel(P()+"/subject"), apiDel(P()+"/judged")
    ]).then(function(){ S.game=freshGame(); return apiPut(P()+"/state", S.game); }).then(render);
  }
}

function join(role, code, name){
  var c = String(code||"").trim().toUpperCase();
  if(!c) return;
  S.room=c; S.name=String(name||"").trim(); S.role=role; S.winnerSeen=false;
  render();
  apiGet(P()+"/state").then(function(st){
    if(st){
      if(st.gid && S.game.gid && st.gid!==S.game.gid) resetLocal();
      S.game=st; S.game.history=arr(st.history); S.game.usedIds=arr(st.usedIds); S.game.results=arr(st.results);
    }
    else if(role==="gm"){ S.game=freshGame(); apiPut(P()+"/state", S.game); }
    if(role==="rep"||role==="gm"){
      apiGet(P()+"/subject").then(function(sj){
        if(sj && sj.text){
          S.peek=sj.text; S.subject=sj.text; S.drafts.subject=sj.text;
          S.alts=arr(sj.alts).join("、"); S.drafts.alts=S.alts; S.subjectSaved=true;
        }
        render();
      });
    }
    render();
  });
  startLoops();
}

/* ---------- 定期取得 ---------- */
var timer = null;
function startLoops(){
  if(timer) clearTimeout(timer);
  schedule(0);
}
function schedule(ms){
  if(timer) clearTimeout(timer);
  timer = setTimeout(function(){
    tick();
    // 端末ごとに間隔を少しずらし、一斉に通信が集中しないようにする
    var base = (S.role==="gm") ? 3000 : 4000;
    schedule(base + Math.floor(Math.random()*1200));
  }, ms);
}
function tick(){
  if(!dbBase() || !S.role || !S.room) return;
  if(document.hidden) return;           // 画面を見ていないあいだは通信しない
  if(S.role==="gm") gmSync(); else playerSync();
}
document.addEventListener("visibilitychange", function(){
  if(!document.hidden && S.role) schedule(0);   // 画面に戻ったらすぐ最新に追いつく
});


// 通信の失敗が続いたときだけ警告を出す。1回きりの失敗では騒がない。
function netResult(ok){
  if(ok){
    S.netFail = 0;
    if(S.netErr){ S.netErr = false; render(); }
    return;
  }
  S.netFail++;
  if(S.netFail >= 2 && !S.netErr){ S.netErr = true; render(); }
}

function playerSync(){
  // 判定待ちの解答があるあいだだけ、進行役の照合状況を確認する（数バイト）
  if(S.role==="player" && S.myGuesses.some(function(x){ return verdictOf(x)==="pending"; })){
    apiGet(P()+"/judged").then(function(v){
      if(typeof v==="number" && v!==S.judgedTs){ S.judgedTs=v; render(); }
    });
  }
  // 代表者はお題が未取得のあいだだけ確認する
  if(S.role==="rep" && (!S.peek || g().phase==="setup")){
    apiGet(P()+"/subject").then(function(sj){
      var t = sj && sj.text ? sj.text : null;
      if(t!==S.peek){ S.peek=t; render(); }
    });
  }
  // まず更新時刻だけを取得する（数十バイト）。変わっていなければ本体は取りにいかない。
  apiGet(P()+"/state/updatedAt").then(function(stamp){
    netResult(stamp!==null);
    if(stamp===null) return;
    if(stamp===S.game.updatedAt) return;
    return apiGet(P()+"/state").then(function(st){
      if(!st) return;
      if(st.gid && S.game.gid && st.gid!==S.game.gid) resetLocal();
      S.game = st;
      S.game.history=arr(st.history); S.game.usedIds=arr(st.usedIds); S.game.results=arr(st.results);
      if(!st.current || (S.answeredId && st.current.id!==S.answeredId)) S.answeredId=null;
      render();
    });
  });
}

function gmSync(){
  apiGet(P()).then(function(room){
    netResult(room!==null);
    if(!room){ return; }
    var st = room.state;
    if(st){
      S.game = st;
      S.game.history=arr(st.history); S.game.usedIds=arr(st.usedIds); S.game.results=arr(st.results);
    }
    // 投稿された質問
    var subs=[];
    Object.keys(room.subs||{}).forEach(function(k){
      arr((room.subs[k]||{}).list).forEach(function(q){ subs.push(q); });
    });
    subs.sort(function(a,b){ return a.ts-b.ts; });
    S.subs = subs;

    // 題材と別解
    var answers=[];
    if(room.subject && room.subject.text){
      S.peek = room.subject.text;
      answers = [room.subject.text].concat(arr(room.subject.alts));
    }
    var ready = Boolean(room.subject && room.subject.text);

    // 解答の照合
    var keys = answers.map(norm), gl=[];
    Object.keys(room.guesses||{}).forEach(function(k){
      var who = room.guesses[k]||{};
      arr(who.list).forEach(function(x){
        gl.push({id:x.id, text:x.text, ts:x.ts, name:who.name||"名無し", correct:keys.indexOf(norm(x.text))>=0});
      });
    });
    gl.sort(function(a,b){ return a.ts-b.ts; });
    S.guesses = gl;

    // 「ここまで照合した」という目印。正解者を先に知らせてから置く。
    var latestTs = gl.length ? gl[gl.length-1].ts : 0;
    var markJudged = function(){
      if(latestTs !== S.judgedPub){ S.judgedPub = latestTs; return apiPut(P()+"/judged", latestTs); }
    };

    // 投票の集計
    var counts={}, voters=0;
    Object.keys(room.votes||{}).forEach(function(k){
      var v = room.votes[k]; if(!v||!v.qid) return;
      counts[v.qid]=(counts[v.qid]||0)+1; voters++;
    });
    var results = Object.keys(counts).map(function(qid){ return {qid:qid, count:counts[qid]}; })
      .sort(function(a,b){ return b.count-a.count; });

    render();

    // 状態の更新が必要なものを順に反映
    var G = S.game;
    if(ready !== Boolean(G.subjectReady)) return publish(function(n){ n.subjectReady=ready; });
    if(!G.winner){
      var hit = gl.filter(function(x){return x.correct;})[0];
      if(hit) return publish(function(n){
        n.winner={name:hit.name, text:hit.text, ts:hit.ts};
        n.current=null; n.phase="reveal"; n.revealed=answers[0]||"";
      }).then(markJudged);
    }
    markJudged();
    if(G.current && room.ans && room.ans.id===G.current.id){
      var cur = G.current, ansKey = room.ans.answer;
      return publish(function(n){
        n.history = arr(n.history).concat([{id:cur.id, text:cur.text, author:cur.author, answer:ansKey}]);
        n.current = null;
        n.last = {id:cur.id, text:cur.text, author:cur.author, answer:ansKey};
      });
    }
    if(G.phase==="voting"){
      if(JSON.stringify(results)!==JSON.stringify(arr(G.results)) || G.voterCount!==voters){
        return publish(function(n){ n.results=results; n.voterCount=voters; });
      }
    }
  });
}

/* ---------- 起動 ---------- */
(function(){
  var m = location.search.match(/[?&]db=([^&]+)/);
  if(m) localStorage.setItem("mq_db", decodeURIComponent(m[1]));
  var r = location.search.match(/[?&]room=([A-Za-z0-9]{3,6})/);
  if(r) S.drafts.pcode = r[1].toUpperCase();
  render();
})();
</script>
